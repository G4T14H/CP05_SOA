spring.application.name=autoescola-api
spring.datasource.url=${DB_URL:jdbc:h2:file:./dados/autoescola;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
spring.jackson.time-zone=America/Sao_Paulo
server.port=${PORT:8080}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.jwt.secret=${JWT_SECRET:c2VjcmV0LWNoZWNrcG9pbnQtNC1hdXRvLWVzY29sYS1zb2Etd2ViLXNlcnZpY2VzLWZpYXA}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.senha=${ADMIN_PASSWORD:admin123}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
app.viacep.base-url=${VIACEP_URL:https://viacep.com.br/ws}
springdoc.swagger-ui.path=/swagger-ui.html
